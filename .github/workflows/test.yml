name: Test Get Info Bot

on:
  push:
    paths:
      - 'tools/get-info-bot/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'tools/get-info-bot/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    defaults:
      run:
        working-directory: tools/get-info-bot
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"
    
    - name: Check code formatting with black
      run: |
        black --check src tests
    
    - name: Lint with ruff
      run: |
        ruff check src tests
    
    - name: Type check with mypy
      run: |
        mypy src --ignore-missing-imports
    
    - name: Run tests with coverage
      env:
        TELEGRAM_BOT_TOKEN: test_token_for_ci
        ADMIN_IDS: "12345,67890"
      run: |
        pytest --cov=tools_nn_bot --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./tools/get-info-bot/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: tools/get-info-bot
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t get-info-bot:test .
    
    - name: Test Docker image structure
      run: |
        docker run --rm get-info-bot:test python -c "import tools_nn_bot; print(tools_nn_bot.__version__)"
